name: Traffic snapshot

on:
  schedule:
    - cron: '17 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Snapshot GitHub traffic
        run: node scripts/sync-traffic-snapshot.mjs --write
        env:
          GITHUB_TOKEN: ${{ secrets.TRAFFIC_PAT }}
      - name: Commit history updates
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add data/traffic-history.json
          git diff --cached --quiet || (git commit -m 'chore: daily traffic snapshot' && git push)
