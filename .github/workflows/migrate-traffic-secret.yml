name: Migrate traffic secret to private operations

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Store the existing traffic token in the private repository
        env:
          GH_TOKEN: ${{ secrets.TRAFFIC_PAT }}
          TRAFFIC_PAT: ${{ secrets.TRAFFIC_PAT }}
        run: printf '%s' "$TRAFFIC_PAT" | gh secret set TRAFFIC_PAT --repo SkyNotSilent/awesome-MiniMax-H3-ops
