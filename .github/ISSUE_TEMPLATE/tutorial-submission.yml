name: Submit a tutorial
description: Propose an original MiniMax H3 tutorial or open-source workflow.
title: "[Tutorial]: "
labels: ["submission", "tutorial"]
body:
  - type: markdown
    attributes:
      value: |
        Share your original tutorial in English or Chinese — we help prepare the bilingual page.
        Accepted author submissions enter a 14-day rotating spotlight with permanent credit and source links.
        欢迎中英文原创教程；我们协助整理双语页面。审核通过后进入 14 天轮换推荐，长期保留作者署名与原作入口。
  - type: input
    id: author-profile
    attributes:
      label: Author profile and authorship
      description: Link your original channel or profile and explain your connection to the tutorial. 请注明是否为原作者，并提供希望展示的作者主页。
  - type: input
    id: source
    attributes:
      label: Original tutorial URL
    validations:
      required: true
  - type: input
    id: repository
    attributes:
      label: Related repository or documentation
      description: Link the README or documentation that supports the commands.
  - type: textarea
    id: outcome
    attributes:
      label: Goal and expected result
      description: State what a reader will produce and how they can tell it worked.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Tested environment
      description: Include OS, GPU/Apple chip, VRAM or memory, versions, disk needs, and approximate time.
    validations:
      required: true
  - type: textarea
    id: commands
    attributes:
      label: Verified commands and known failures
      description: Provide executable commands, common errors, and rollback or uninstall steps.
    validations:
      required: true
  - type: checkboxes
    id: originality
    attributes:
      label: Source checks
      options:
        - label: The linked source is original and specifically applies to MiniMax H3.
          required: true
        - label: I have not guessed missing commands, versions, or compatibility claims.
          required: true
