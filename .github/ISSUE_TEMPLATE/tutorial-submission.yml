name: Submit a tutorial or learning resource
description: Share an original setup guide, practical project, video lesson, or useful method.
title: "[Tutorial]: "
labels: ["submission", "tutorial", "status: needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Share your original tutorial in English or Chinese — we help prepare the bilingual page.
        Accepted author submissions enter a 14-day rotating spotlight with permanent credit and source links.
        欢迎中英文原创教程；我们协助整理双语页面。审核通过后进入 14 天轮换推荐，长期保留作者署名与原作入口。
        You do not need to edit project data, translate your submission, or provide project-storage access.
  - type: dropdown
    id: tutorial-type
    attributes:
      label: Tutorial type / 教程类型
      options:
        - Setup or installation / 安装与部署
        - Practical creative project / 创作实战
        - Video tutorial / 视频教学
        - Resource or method / 资源与方法
    validations:
      required: true
  - type: input
    id: author-profile
    attributes:
      label: Author profile and authorship
      description: Link your original channel or profile and explain your connection to the tutorial. 请注明是否为原作者，并提供希望展示的作者主页。
  - type: input
    id: source
    attributes:
      label: Original tutorial URL
    validations:
      required: true
  - type: input
    id: repository
    attributes:
      label: Related repository or documentation
      description: Link the README or documentation that supports the commands.
  - type: textarea
    id: outcome
    attributes:
      label: Goal and expected result
      description: State what a reader will produce and how they can tell it worked.
    validations:
      required: true
  - type: textarea
    id: materials
    attributes:
      label: Steps, materials, or useful video chapters
      description: Setup guides should include environment and commands. Practical/video guides can instead provide inputs, workflow, parameters, timestamps, expected output, and known limits.
    validations:
      required: true
  - type: textarea
    id: verification
    attributes:
      label: What you personally verified
      description: Tell us what you ran or created. Say "not tested" for anything based only on linked documentation.
    validations:
      required: true
  - type: checkboxes
    id: originality
    attributes:
      label: Source checks
      options:
        - label: The linked source is original and specifically applies to MiniMax H3.
          required: true
        - label: I have not guessed missing commands, versions, compatibility, or results.
          required: true
        - label: I allow this project to summarize and present the submitted material with permanent attribution and links to the original source.
          required: true
